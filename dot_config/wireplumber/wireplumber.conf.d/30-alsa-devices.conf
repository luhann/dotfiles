# Per-device overrides for the two USB DACs.
#
# NOTE on rule scoping: monitor.alsa.rules matches devices AND nodes, but a
# rule that matches on device.* only ever updates the Device object. Node-level
# properties (session.suspend-timeout-seconds, priority.driver) MUST be set by
# a rule that matches on node.name, or they land on the device and are silently
# ignored. Check what actually landed with:
#   pw-dump | grep -A5 suspend-timeout

monitor.alsa.rules = [
    # ---- device-level ----
    # Batch mode adds a period of latency; both of these are proper async USB
    # interfaces that don't need it. Scoped to the two DACs rather than
    # device.bus = "usb" so it can't affect USB headsets/webcams/mics.
    #
    # audio.format is deliberately NOT forced here: PipeWire already negotiates
    # the widest format the device advertises (both DACs land on S32LE on their
    # own, as does the untouched HDMI sink).
    #
    # api.alsa.headroom is likewise left at the default of 0. Only raise it if
    # `pw-top` actually shows a rising ERR count.
    {
        matches = [
            { device.name = "~alsa_card.usb-FIIO_FIIO_KA15.*" }
            { device.name = "~alsa_card.usb-LOUD_Technologies_Inc.*" }
        ]
        actions = {
            update-props = {
                api.alsa.disable-batch = true
            }
        }
    }

    # ---- node-level ----
    # Suspending these DACs causes an audible pop on resume. Default is 5s.
    {
        matches = [
            { node.name = "~alsa_.*put.usb-FIIO_FIIO_KA15.*" }
            { node.name = "~alsa_.*put.usb-LOUD_Technologies_Inc.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }

    # Both DAC sinks default to priority.driver = 1109, so when they end up in
    # one graph (combine-sink.conf) the tie breaks arbitrarily by node id and
    # the Onyx wins. Whichever node is not the driver gets adaptively resampled
    # onto the driver's clock, so make the KA15 win — that's the critical
    # listening path.
    #
    # 2000 is deliberately below the Onyx *capture* node's 2109: an active
    # recording should still drive the graph rather than be resampled.
    {
        matches = [
            { node.name = "~alsa_output.usb-FIIO_FIIO_KA15.*" }
        ]
        actions = {
            update-props = {
                priority.driver = 2000
            }
        }
    }
]
