# pipewire-pulse serves its own stream.properties and does NOT read
# client.conf.d, so these have to be duplicated here. Without this file every
# PulseAudio client (Firefox, Spotify, anything on libpulse — i.e. most apps)
# silently falls back to resample.quality = 4.
#
# Verify the merged result with:
#   pw-config -n pipewire-pulse.conf list stream.properties
stream.properties = {
    resample.quality = 14
    dither.method = "wannamaker3"
    dither.noise = 0
}
