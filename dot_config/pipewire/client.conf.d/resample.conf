stream.properties = {
    resample.quality = 14
    dither.method = "wannamaker3"
    # dither.noise injects N bits of noise to keep DAC circuits awake during
    # silence. Keep at 0 — session.suspend-timeout-seconds already stops the
    # DACs from being suspended, and any noise here is by definition not
    # bit-perfect.
    dither.noise = 0
}
