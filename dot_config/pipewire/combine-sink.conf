# On-demand combined sink: headphones (FIIO KA15) + monitors (Onyx Producer).
#
#   Start:  pipewire -c combine-sink.conf
#   Stop:   Ctrl-C / kill that process
#
# This is deliberately NOT in pipewire.conf.d/. Loaded into the main daemon it
# creates permanent links from the combine streams to BOTH DACs, and linked
# nodes share one driver group — so the KA15 gets adaptively resampled onto the
# Onyx's clock during normal headphone listening, even while combined_sink sits
# suspended and unused. Run as a separate instance (same pattern as
# /usr/share/pipewire/filter-chain.conf) the links only exist while you want them.
#
# The headphone leg targets the EQ sink, not the KA15 directly, so the DT 990
# correction still applies to headphones and is kept off the monitors.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    {   name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "combined_sink"
            node.description = "Combined Sink (Headphones + Monitors)"
            combine.props = {
                audio.position = [ FL FR ]
            }
            stream.rules = [
                {
                    matches = [
                        { media.class = "Audio/Sink" node.name = "effect_input.dt990" }
                    ]
                    actions = {
                        create-stream = {}
                    }
                }
                {
                    matches = [
                        { media.class = "Audio/Sink" node.name = "alsa_output.usb-LOUD_Technologies_Inc._Onyx_Producer_2-2-00.analog-stereo" }
                    ]
                    actions = {
                        create-stream = {}
                    }
                }
            ]
        }
    }
]
