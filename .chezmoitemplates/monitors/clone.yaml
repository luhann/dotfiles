# Work desktop: 3840x1080 ultrawide on HDMI, 1920x1080 to its left on DP.
- output: "HDMI-A-1"
  mode: "3840x1080@60"
  position: "auto"
  scale: "auto"
  bitdepth: 10
- output: "DP-1"
  mode: "1920x1080@60"
  position: "auto-left"
  niri_x: -1920
  niri_y: 0
  scale: "auto"
  bitdepth: 10
- output: ""
  mode: "preferred"
  position: "auto"
  scale: "1"
