# patroclus — desktop palette.
#
# GENERATED by tools/gen_tokens.py in the patroclus repo, from its
# design.yaml. Do not edit here; change design.yaml, regenerate, and
# `chezmoi apply`. `gen_tokens.py --check` verifies freshness.
#
# The chezmoi colour scheme chosen in .chezmoi.yaml.tmpl. Everything that
# reads `.colors.*` is downstream of this file: alacritty, dunst, hyprland,
# hyprlock, waybar, niri and nvim.
#
# Values come from themes.screen.palettes.dark (the editorial palette) and
# themes.screen.desktop (the ANSI rows). Each is noted with the token it
# came from. Keys are kept even where nothing reads them, so a config that
# starts using one does not find a hole.

colors:

  # Background stack. patroclus grounds on pure black, so the tones a
  # catppuccin-shaped palette puts *below* `base` become the surface
  # stack above it.
  base:   "#000000" # bg
  mantle: "#0b0e12" # surface
  crust:  "#13171c" # surface_soft

  # Surfaces.
  surface0: "#13171c" # surface_soft
  surface1: "#2e333b" # line — alacritty's normal black, hypr's inactive border
  surface2: "#50565c" # bright black

  # Text. patroclus carries three tones where this palette wants four, so
  # `text` serves as the normal-white ANSI slot as well.
  text:     "#abb2b9" # text
  subtext1: "#abb2b9" # text — alacritty's normal white
  subtext0: "#8f969d" # muted — dunst's low-urgency foreground

  # Overlay and comment greys.
  overlay0: "#2e333b" # line
  overlay1: "#50565c" # bright black
  overlay2: "#8f969d" # muted

  # Accent hues. Copper, steel and alizarin are the palette's own; sage,
  # ochre, verdigris and plum are the desktop companions.
  blue:     "#669ac5" # steel
  sapphire: "#669ac5" # steel
  sky:      "#5fc4c0" # verdigris, brightened
  teal:     "#37a19e" # verdigris
  green:    "#719e58" # sage
  yellow:   "#bf9932" # ochre
  peach:    "#cf7d55" # copper
  red:      "#d33949" # alizarin, lifted off black
  maroon:   "#a51c30" # accent_meta — alizarin proper
  pink:     "#d599d8" # plum, brightened
  mauve:    "#c081aa" # plum
  lavender: "#c081aa" # plum

  # ANSI bright row (8-15).
  bright_black:   "#50565c"
  bright_red:     "#ea696e"
  bright_green:   "#93c179"
  bright_yellow:  "#dfb956"
  bright_blue:    "#79b8ed"
  bright_magenta: "#d599d8"
  bright_cyan:    "#5fc4c0"
  bright_white:   "#f2efe9"

  # UI roles.
  selection: "#3a2318" # accent at the 0.28 selection tint, flattened over bg
  border:    "#2e333b" # line
  accent:    "#cf7d55" # copper
  warning:   "#bf9932" # ochre
  error:     "#d33949" # alizarin, lifted
  success:   "#719e58" # sage

  # Syntax and diff tints. Flattened from the rgba() forms in
  # themes.screen.syntax.dark, which the desktop consumers cannot layer.
  # The emph pair doubles the alpha for delta's changed-word highlight.
  comment:       "#72797f" # syntax comment
  diff_add_bg:   "#0c151d" # ins_bg
  diff_add_emph: "#182a39" # ins_bg, doubled
  diff_del_bg:   "#190407" # del_bg
  diff_del_emph: "#32080e" # del_bg, doubled
  diff_chg_bg:   "#1f130d" # chg_bg

  # Status colours for bars and panels.
  active:   "#cf7d55" # copper
  inactive: "#50565c" # bright black
  urgent:   "#d33949" # alizarin, lifted
  focused:  "#cf7d55" # copper

  # Legacy keys from the kanagawa-era palette this replaced. The names no
  # longer describe the colours; they track the bright row so the configs
  # still naming them (hyprlock's clock, niri's focus ring) keep working.
  cyber_yellow: "#dfb956" # ochre, brightened
  cyber_teal:   "#5fc4c0" # verdigris, brightened
  cyber_red:    "#ea696e" # alizarin, brightened
